<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Game Belajar TK B</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#87CEEB,#E0FFFF);
min-height:100vh;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#ff6600;
margin-bottom:15px;
}

.info{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.card{
background:#f5f5f5;
padding:10px 20px;
border-radius:10px;
font-weight:bold;
}

.progress-wrap{
background:#ddd;
height:20px;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress{
background:#4caf50;
height:100%;
width:0%;
}

.level{
font-size:22px;
font-weight:bold;
color:#2196f3;
text-align:center;
margin-bottom:10px;
}

.question{
font-size:28px;
text-align:center;
margin:20px 0;
font-weight:bold;
}

.emoji{
font-size:80px;
text-align:center;
margin:10px;
}

.options{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}

.option{
padding:18px;
border:none;
border-radius:12px;
background:#2196f3;
color:white;
font-size:18px;
cursor:pointer;
}

.option:hover{
background:#1976d2;
}

input.answer{
width:100%;
padding:15px;
font-size:24px;
text-align:center;
border-radius:10px;
border:2px solid #ccc;
}

.btn{
margin-top:15px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:20px;
cursor:pointer;
background:#ff9800;
color:white;
}

.feedback{
margin-top:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.correct{
color:green;
}

.wrong{
color:#f44336;
}

.hidden{
display:none;
}

@media(max-width:600px){

.question{
font-size:22px;
}

.option{
font-size:16px;
min-height:60px;
}

}
</style>
</head>
<body>

<div class="container">

<h1>🎓 Game Belajar TK B 🌈</h1>

<div class="info">
<div class="card">⭐ <span id="stars">0</span></div>
<div class="card">Soal <span id="current">1</span>/300</div>
<div class="card">🏆 <span id="score">0</span></div>
</div>

<div class="progress-wrap">
<div class="progress" id="progress"></div>
</div>

<div id="level" class="level"></div>

<div id="emoji" class="emoji"></div>

<div id="question" class="question"></div>

<div id="options" class="options"></div>

<div id="typingSection" class="hidden">
<input id="answerInput" class="answer" type="number">
<button class="btn" onclick="checkTyping()">Jawab</button>
</div>

<div id="feedback" class="feedback"></div>

<button id="nextBtn" class="btn hidden" onclick="nextQuestion()">
Lanjut ➜
</button>

</div>

<script>

const TOTAL_QUESTIONS = 300;

let score=0;
let stars=0;
let current=0;
let currentAnswer=null;
let typingMode=false;

const benda=[
["🍎","Apel"],
["🍌","Pisang"],
["🍇","Anggur"],
["🍓","Stroberi"],
["🥕","Wortel"],
["🐱","Kucing"],
["🐶","Anjing"],
["🐰","Kelinci"],
["🦁","Singa"],
["🐵","Monyet"],
["🚗","Mobil"],
["✈️","Pesawat"],
["🚲","Sepeda"],
["🚂","Kereta"],
["🚢","Kapal"]
];

const warna=[
["🔴","Merah"],
["🟡","Kuning"],
["🟢","Hijau"],
["🔵","Biru"]
];

const bentuk=[
["⚪","Lingkaran"],
["⬛","Persegi"],
["🔺","Segitiga"],
["💎","Belah Ketupat"]
];

function rand(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

let questions=[];

function generateQuestions(){

for(let i=0;i<50;i++){

let item=rand(benda);

questions.push({
level:"Mengenal Benda",
emoji:item[0],
question:"Apa nama benda/hewan ini?",
answer:item[1],
options:shuffle([
item[1],
rand(benda)[1],
rand(benda)[1],
rand(benda)[1]
])
});
}

for(let i=0;i<50;i++){

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;

let answer=a+b;

questions.push({
level:"Berhitung",
emoji:"🍎".repeat(a),
question:`${a} + ${b} = ?`,
answer:String(answer),
typing:true
});
}

for(let i=0;i<50;i++){

let item=Math.random()>0.5?rand(warna):rand(bentuk);

questions.push({
level:"Warna & Bentuk",
emoji:item[0],
question:"Pilih jawaban yang benar",
answer:item[1],
options:shuffle([
item[1],
"Mobil",
"Kucing",
"Pisang"
])
});
}

for(let i=0;i<50;i++){

let start=Math.floor(Math.random()*10)+1;

questions.push({
level:"Pola Angka",
emoji:"🔢",
question:`${start}, ${start+1}, ${start+2}, ?`,
answer:String(start+3),
typing:true
});
}

for(let i=0;i<50;i++){

let item=rand(benda);

questions.push({
level:"Cocokkan Pasangan",
emoji:item[0],
question:"Pilih pasangan yang sesuai",
answer:item[1],
options:shuffle([
item[1],
rand(benda)[1],
rand(benda)[1],
rand(benda)[1]
])
});
}

for(let i=0;i<50;i++){

let a=Math.floor(Math.random()*20)+1;
let b=Math.floor(Math.random()*10)+1;

let answer=a+b;

questions.push({
level:"Kuis Campuran",
emoji:"🎯",
question:`${a} + ${b} = ?`,
answer:String(answer),
typing:true
});
}

shuffle(questions);

}

generateQuestions();

function loadQuestion(){

let q=questions[current];

document.getElementById("current").textContent=current+1;
document.getElementById("score").textContent=score;
document.getElementById("stars").textContent=stars;

document.getElementById("level").textContent=q.level;
document.getElementById("question").textContent=q.question;
document.getElementById("emoji").textContent=q.emoji;

document.getElementById("feedback").innerHTML="";
document.getElementById("nextBtn").classList.add("hidden");

let progress=((current)/TOTAL_QUESTIONS)*100;
document.getElementById("progress").style.width=progress+"%";

currentAnswer=q.answer;

if(q.typing){

typingMode=true;

document.getElementById("typingSection")
.classList.remove("hidden");

document.getElementById("options").innerHTML="";

document.getElementById("answerInput").value="";

}else{

typingMode=false;

document.getElementById("typingSection")
.classList.add("hidden");

let html="";

q.options.forEach(opt=>{

html+=`
<button class="option"
onclick="checkAnswer('${opt}')">
${opt}
</button>`;
});

document.getElementById("options").innerHTML=html;
}
}

function checkAnswer(ans){

let fb=document.getElementById("feedback");

if(ans===currentAnswer){

score+=10;
stars++;

fb.className="feedback correct";
fb.innerHTML="🎉 Hebat!";

}else{

fb.className="feedback wrong";
fb.innerHTML="😊 Coba Lagi";
}

document.getElementById("nextBtn")
.classList.remove("hidden");
}

function checkTyping(){

let ans=document.getElementById("answerInput")
.value.trim();

checkAnswer(ans);
}

function nextQuestion(){

current++;

if(current>=TOTAL_QUESTIONS){

document.querySelector(".container").innerHTML=
`
<h1>🎉 Selamat 🎉</h1>

<h2 style="text-align:center">
Skor Akhir: ${score}
</h2>

<h2 style="text-align:center">
⭐ Bintang: ${stars}
</h2>

<button class="btn"
onclick="location.reload()">
Main Lagi
</button>
`;

return;
}

loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
